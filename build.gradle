
import com.modrinth.minotaur.TaskModrinthUpload
import com.modrinth.minotaur.dependencies.ModDependency
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import net.darkhax.curseforgegradle.TaskPublishCurseForge
import net.darkhax.curseforgegradle.UploadArtifact

plugins {
    id 'net.darkhax.curseforgegradle' version '1.1.16'
    id "com.modrinth.minotaur" version "2.+"
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

def build_number = System.env.BUILD_NUMBER ?: 1
def release_type = System.env.TC_RELEASE_TYPE ?: "alpha"

ext.configFile = file('gradle.properties')
ext.config = parseConfig(configFile)

version = "${minecraft_version}-${neoforge_version}-b${build_number}"
group = 'leaf.soulhome'
base.archivesName = "${project.jar_name}"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/main/generated' }

repositories {
    maven {
        //used for patchouli
        url "https://maven.blamejared.com/"
    }
    maven {
        //curio
        url "https://maven.theillusivec4.top/"
    }
    maven {
        //fallback
        url 'https://modmaven.dev/'
    }
    maven {
        //jade
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

neoForge {
    version = project.neoforge_version

    // Access Transformers are auto-detected from src/main/resources/META-INF/accesstransformer.cfg

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/main/generated/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // compile against the JEI API but do not include it at runtime
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    implementation "maven.modrinth:jade:${project.jade_version}"

    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}-NEOFORGE:api"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}-NEOFORGE"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "soulhome",
                "Specification-Vendor"    : "soulhome",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "soulhome",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

processResources {
    // Exclude datagenerator .cache directory
    exclude '.cache'

    filesMatching('data/soulhome/patchouli_books/guide/book.json') {
        filter {
            it.replaceAll("buildNumber", "${build_number}")
        }
    }
}

task incrementBuildNumber {
    doFirst {
        config.build_number = (config.build_number.toString().toInteger()) + 1
        configFile.withWriter {
            config.toProperties().store(it, "")
        }
    }
}

def parseConfig(File config) {
    if (config.exists()) {
        config.withReader {
            def prop = new Properties()
            prop.load(it)
            return (new ConfigSlurper().parse(prop))
        }
    } else {
        return null
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

def resolvedChangelog = null

//closure to generate the changelog once, and only when needed by CurseGradle
def changeLogResolver = { ->
    String generatedChangelog;

    //autogenerated log via teamcity, which uses a generic powershell script to generate a changelog
    def autogeneratedChangelog = project.file("docs/changelog_Soulhome_${build_number}.txt")
    if (autogeneratedChangelog.exists()) {
        //Add any version specific changelog stuff
        String changelogText = autogeneratedChangelog.getText()
        changelogText = changelogText.replace("+ : ", "<br>")
        generatedChangelog = "$changelogText"
    } else {
        generatedChangelog = "Unable to generate changelog :("
    }

    //add hand written log to put at the top
    def releaseNotesFile = project.file("docs/release_${build_number}.txt")
    if (releaseNotesFile.exists()) {
        //Add any version specific changelog stuff
        def releaseNotes = releaseNotesFile.getText()
        generatedChangelog = "$releaseNotes<br>-<br> $generatedChangelog"
    }

    generatedChangelog =
            "Soulhome - Build " + build_number.toString() +
                    "<br><br> $generatedChangelog"
    resolvedChangelog = generatedChangelog
    return generatedChangelog
}

if (System.getenv("CURSEFORGE_API_TOKEN") != null || project.hasProperty('curseforge_api_token')) {
    println "Enabling Curseforge config"
    tasks.register("curseforge", TaskPublishCurseForge, { task ->
        setGroup("publishing")
        setDescription("Upload to CurseForge")
        //https://authors.curseforge.com/account/api-tokens
        apiToken = System.getenv("CURSEFORGE_API_TOKEN") ?: project.findProperty("curseforge_api_token")

        def changelog = changeLogResolver.call()

        task.upload(574511, jar) { main ->
            setGenericCurseArtifactData(main, changelog, release_type)
            //Add optional deps
            addOptional(
                    //'curios',
                    'patchouli',
                    'jei',
            )
        }
    })
}

void setGenericCurseArtifactData(UploadArtifact artifact, String changelog, String release_type)
{
    artifact.changelog = changelog
    artifact.changelogType = 'text'
    artifact.releaseType = "${release_type}"
    artifact.addModLoader("NeoForge")
}

if (System.getenv("MODRINTH_API_TOKEN") != null || project.hasProperty('modrinth_api_token')) {
    println "Enabling Modrinth config"
    modrinth {
        //https://modrinth.com/settings/pats
        token = System.getenv("MODRINTH_API_TOKEN") ?: project.findProperty("modrinth_api_token")
        projectId = project.modrinth_project_id
        versionType = release_type
        versionNumber = "${project.minecraft_version}-${build_number}"
        versionName = "soulhome ${project.minecraft_version}-${project.neoforge_version}-b${build_number}"
        uploadFile = jar
        changelog = changeLogResolver.call()
        gameVersions = [project.minecraft_version]
        loaders = ['neoforge']
        dependencies {
            optional.project "jei"
            optional.project "patchouli"
            optional.project "jade"
            optional.project "curios"
        }
    }
}

